name: Right of reply
description: Publish a response on behalf of a company covered on the site
title: "Reply: "
labels: ["right-of-reply"]
body:
  - type: markdown
    attributes:
      value: |
        If you represent a company with a scorecard, you can publish a response: context for an answer, a document we should read, or a change since our last check.
        Responses are **public** and are linked from the scorecard as filed. Please don't include personal contact details.
  - type: input
    id: app
    attributes:
      label: App
      description: The scorecard's app, e.g. chatgpt
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the relevant document (optional)
  - type: checkboxes
    id: public
    attributes:
      label: Publication
      options:
        - label: I understand this response is public and will be linked from the scorecard.
          required: true
